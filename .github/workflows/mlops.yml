name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v tests/


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -c "
          import os, json
          key = os.environ.get('GCP_SA_KEY', '').strip()
          if not key:
              raise SystemExit('ERROR: GCP_SA_KEY secret is empty. Please check GitHub Secrets.')
          try:
              json.loads(key)
          except Exception as e:
              raise SystemExit(f'ERROR: GCP_SA_KEY secret is not valid JSON: {e}')
          with open('/tmp/sa-key.json', 'w') as f:
              f.write(key)
          with open('sa-key.json', 'w') as f:
              f.write(key)
          print('GCP SA Key successfully written and validated.')
          "
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          dvc remote modify myremote credentialpath /tmp/sa-key.json

      - name: Pull data with DVC
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
          dvc remote modify myremote credentialpath /tmp/sa-key.json
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          python -c "
          import os
          from google.cloud import storage

          bucket_name = os.environ.get('GCS_BUCKET')
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob('models/latest/model.pkl')
          blob.upload_from_filename('models/model.pkl')
          print('Model uploaded successfully to GCS.')
          "

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python -c "
          acc = float('${{ needs.train.outputs.accuracy }}')
          print(f'Current Model Accuracy: {acc:.4f}')
          if acc < 0.70:
              raise SystemExit(f'FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.')
          print('PASSED: Dang trien khai model.')
          "


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart mlops-serve || sudo systemctl restart mlops.service
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1


